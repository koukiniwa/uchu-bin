name: 打ち上げ予定更新

on:
  schedule:
    - cron: '0 * * * *'  # 1時間ごと
  workflow_dispatch:

jobs:
  update-launches:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: npm install
        run: npm install

      - name: 打ち上げデータ取得
        run: node scripts/fetch-launches.js

      - name: 注目の打ち上げデータ生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-featured.js

      - name: 変更があればコミット
        run: |
          git config user.name "宇宙便 Bot"
          git config user.email "bot@uchu-bin.jp"
          git add public/data/launches.json public/data/featured.json
          git diff --cached --quiet || git commit -m "打ち上げ予定更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push

      - name: 打ち上げ予告ツイート
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: node scripts/tweet-launch-preview.js

      - name: 予告済みリスト保存
        run: |
          if [ -f public/data/tweeted-previews.json ]; then
            git add public/data/tweeted-previews.json
            git diff --cached --quiet || git commit -m "予告ツイート済みリスト更新"
            git pull --rebase origin main
            git push
          fi
