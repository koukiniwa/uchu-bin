name: ロケット図鑑データ更新

on:
  schedule:
    - cron: '30 15 * * *'  # 毎日 0:30 JST（UTC 15:30）
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: npm install
        run: npm install

      - name: ロケット統計データ生成
        run: node scripts/generate-rocket-stats.js

      - name: 変更があればコミット
        run: |
          git config user.name "宇宙便 Bot"
          git config user.email "bot@uchu-bin.jp"
          git add public/data/rockets/
          git diff --cached --quiet || git commit -m "ロケット図鑑データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
